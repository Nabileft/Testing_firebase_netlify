<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mini SLD Designer</title>

<style>
    body {
        margin: 0;
        display: flex;
        font-family: Arial;
    }

    /* Sidebar */
    .sidebar {
        width: 200px;
        background: #2c3e50;
        color: white;
        padding: 10px;
    }

    .item {
        background: #34495e;
        padding: 10px;
        margin: 10px 0;
        cursor: grab;
        text-align: center;
        border-radius: 5px;
    }

    /* Canvas area */
    canvas {
        background: #ecf0f1;
        flex: 1;
    }
</style>
</head>

<body>

<div class="sidebar">
    <h3>Komponen</h3>
    <div class="item" draggable="true" data-type="bus">Bus</div>
    <div class="item" draggable="true" data-type="gen">Generator</div>
    <div class="item" draggable="true" data-type="load">Load</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth - 200;
canvas.height = window.innerHeight;

let components = [];

// Draw function
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    components.forEach(c => {
        if (c.type === "bus") {
            ctx.fillStyle = "black";
            ctx.fillRect(c.x, c.y, 60, 10);
        }

        if (c.type === "gen") {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillText("G", c.x - 5, c.y + 5);
        }

        if (c.type === "load") {
            ctx.fillStyle = "blue";
            ctx.fillRect(c.x, c.y, 30, 30);
            ctx.fillText("L", c.x + 10, c.y + 20);
        }
    });
}

// Drag dari sidebar
document.querySelectorAll(".item").forEach(item => {
    item.addEventListener("dragstart", e => {
        e.dataTransfer.setData("type", item.dataset.type);
    });
});

// Drop ke canvas
canvas.addEventListener("dragover", e => e.preventDefault());

canvas.addEventListener("drop", e => {
    const type = e.dataTransfer.getData("type");

    components.push({
        type: type,
        x: e.offsetX,
        y: e.offsetY
    });

    draw();
});

// Resize canvas
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth - 200;
    canvas.height = window.innerHeight;
    draw();
});
</script>

</body>
</html>
