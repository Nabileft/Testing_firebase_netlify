<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capstone Timeline</title>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="timeline.css">

</head>

<body>

    <!-- BACKGROUND -->
    <div class="gradient gradient-1"></div>
    <div class="gradient gradient-2"></div>

    <!-- MAIN -->
    <main class="timeline-container">

        <!-- HEADER -->
        <section class="hero">

            <p class="hero-subtitle">
                CAPSTONE PROJECT
            </p>

            <h1 class="hero-title">
                Project Timeline Workspace
            </h1>

            <p class="hero-description">
                Monitor seluruh progress pengerjaan project capstone mulai dari riset,
                desain, development, testing, hingga final implementation.
            </p>

        </section>

        <!-- TIMELINE FORM -->
        <section class="timeline-form glass-card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        NEW TIMELINE
                    </p>

                    <h2>
                        Add Timeline Activity
                    </h2>

                </div>

            </div>

            <form id="timelineForm">

                <!-- TITLE -->
                <div class="form-group">

                    <label>
                        Activity Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Hardware Integration"
                        required
                    >

                </div>

                <!-- DATE -->
                <div class="form-group">

                    <label>
                        Timeline Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>

                <!-- STATUS -->
                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="status">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="On Progress">
                            On Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>

                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Write timeline details..."
                        required
                    ></textarea>

                </div>

                <!-- BUTTON -->
                <button type="submit">

                    Save Timeline

                </button>

            </form>

        </section>

        <!-- TIMELINE LIST -->
        <section class="timeline-list-section">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        PROJECT ROADMAP
                    </p>

                    <h2>
                        Timeline Activity
                    </h2>

                </div>

            </div>

            <!-- TIMELINE -->
            <div id="timelineList" class="timeline-list">

            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="timeline.js"></script>

</body>
</html>
